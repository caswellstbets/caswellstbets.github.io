name: Update Berk's Picks

on:
  schedule:
    # Every 5 minutes (GitHub's minimum; runs often start a few minutes late).
    # ntfy only keeps messages ~12 hours, so this needs to run well inside
    # that window to never miss one. No API key involved.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-berk
  cancel-in-progress: false

jobs:
  update-berk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch new ntfy messages
        run: node scripts/fetch-berk.mjs

      - name: Commit berk_picks.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add berk_picks.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Berk's picks [skip ci]"
          git pull --rebase
          git push
