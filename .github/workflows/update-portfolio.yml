name: Update League Holdings Value

on:
  schedule:
    # Every 30 minutes. No API key/quota involved (Yahoo + CoinGecko are both
    # free/keyless here), and public repos get unlimited Actions minutes, so
    # there's no cost to running this often -- it just keeps the value chart
    # current during market hours without needing "live" client-side calls
    # to a source that blocks browser requests.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest portfolio value
        run: node scripts/fetch-portfolio.mjs

      - name: Commit portfolio.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json
          git diff --cached --quiet || git commit -m "Update league holdings value [skip ci]"
          git push
